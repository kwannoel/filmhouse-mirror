<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Filmhouse</title>
  <meta name="description" content="What's showing at Filmhouse Singapore. Booking happens on filmhouse.sg.">
  <meta name="theme-color" content="#0f0f0f">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">
    <header class="head">
      <h1><a href="https://filmhouse.sg/films/" target="_blank" rel="noopener">Filmhouse</a></h1>
      <p class="stats" id="stats" aria-live="polite"></p>
    </header>

    <nav class="bar">
      <div class="days" id="days" role="group" aria-label="Day"></div>
      <div class="tools">
        <input id="search" type="search" placeholder="Search" aria-label="Search titles, directors and cast" autocomplete="off">
        <button id="filtersToggle" type="button" aria-expanded="false" aria-controls="filters">Filters</button>
      </div>
      <div class="filters" id="filters" hidden>
        <div class="group"><span class="label">Format</span><div id="tags"></div></div>
        <div class="group"><span class="label">Genre</span><div id="genres"></div></div>
        <div class="group"><span class="label">Rating</span><div id="ratings"></div></div>
        <div class="group"><span class="label">Show</span><div id="options"></div></div>
        <div class="group"><span class="label">Sort</span><div id="sorts"></div></div>
      </div>
    </nav>

    <main>
      <ul class="films" id="films"></ul>
      <p class="empty" id="empty" hidden>Nothing matches. <button id="reset" type="button">Clear filters</button></p>
    </main>

    <footer class="foot">
      Unofficial. Listings from <a href="https://filmhouse.sg/films/" target="_blank" rel="noopener">filmhouse.sg</a>, refreshed every 15 minutes. Booking happens there.
    </footer>
  </div>

  <script src="app.js" type="module"></script>
</body>
</html>
